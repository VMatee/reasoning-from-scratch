[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vmatee-verifier-reasoning"
version = "0.1.0"
requires-python = ">=3.10"
description = "Small symbolic search and step verification experiments"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
